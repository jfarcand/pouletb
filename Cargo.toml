[package]
name = "pouletb"
version = "0.1.0"
edition = "2024"
description = "Download a single torrent from the command line, then exit"
license = "Apache-2.0"
repository = "https://github.com/jfarcand/pouletb"
homepage = "https://github.com/jfarcand/pouletb"
readme = "README.md"
keywords = ["torrent", "bittorrent", "magnet", "download", "cli"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["/.github", "/macos"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
ipnet = "2"
librqbit = "9.0.1"
network-interface = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
strip = true

# Same lint policy as dravr-platform's workspace: every clippy group denied,
# with its allow-list. Not copied: its disallowed_methods ban on
# anyhow::Context, which exists to force typed provider errors; a CLI whose
# errors go straight to a person is what anyhow's context chain is for.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_const_for_fn = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
significant_drop_tightening = "allow"
cognitive_complexity = "deny"
clone_on_copy = "warn"
redundant_clone = "warn"
await_holding_lock = "warn"
str_to_string = "deny"
module_name_repetitions = "allow"
uninlined_format_args = "warn"
map_unwrap_or = "warn"
absolute_paths = "deny"
