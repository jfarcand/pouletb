[package]
name = "pouletb"
version = "0.1.0"
edition = "2024"
description = "Download a single torrent from the command line, then exit"
license = "Apache-2.0"
repository = "https://github.com/jfarcand/pouletb"
homepage = "https://github.com/jfarcand/pouletb"
readme = "README.md"
keywords = ["torrent", "bittorrent", "magnet", "download", "cli"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["/.github", "/macos"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
librqbit = "9.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
strip = true
