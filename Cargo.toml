[package]
name = "pouletb"
version = "0.1.0"
edition = "2024"
description = "Download a single torrent from the command line, then exit"
license = "MIT"
repository = "https://github.com/jfarcand/pouletb"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
librqbit = "9.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
